server {
    listen 80;
    server_name _;  # catches any hostname / IP address

    # Max upload size
    client_max_body_size 10M;

    # Serve the React/HTML frontend
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (for future real-time features)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Timeouts
        proxy_read_timeout  300;
        proxy_send_timeout  300;
    }

    # Optional: serve static files directly for performance
    # (only enable after running: uvicorn app.main:app --reload once to build)
    # location /static/ {
    #     alias /opt/wellsound/static/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "same-origin"   always;

    # Logs
    access_log /var/log/nginx/wellsound_access.log;
    error_log  /var/log/nginx/wellsound_error.log;
}
